# ==============================================================================
# Li 2025 Caerin Macrophage Benchmark — LJJCD24 Sub-Panel (Unified Config Schema)
# ==============================================================================

input:
  fcs_file: data/conventional/li_2025_caerin_macrophage/metadata/samples_cd24.csv
  technology: conventional
  metadata_file: data/conventional/li_2025_caerin_macrophage/metadata/samples_cd24.csv
  markers_file: data/conventional/li_2025_caerin_macrophage/metadata/markers_cd24.csv
analysis:
  gating_mode: som
  cluster_parent: viable
  qc_method: clustering
  adaptive_gating: true
  enable_qc: true
  enable_discovery: true
  numbered_steps: true
  seed: 42
  log_level: INFO
visualization:
  legend_mode: centroid
01_time_qc:
  enabled: true
  bin_width: null
02_compensation:
  enabled: true
  source: controls
  controls_dir: data/conventional/li_2025_caerin_macrophage/raw/controls
  unstained_control: data/conventional/li_2025_caerin_macrophage/raw/controls/Compensation
    Controls_Unstained Control_001.fcs
03_cleanup_gating:
  enabled: true
  debris_method: gmm
  debris_n_components: 3
  debris_sd_scale: 1.0
  debris_min_probability: null
  singlet_mode: dual
  singlet_method: gmm_ratio
  singlet_tolerance: 0.25
  enable_viability: true
  viability_channel: BV510-A
  viability_cutoff: null
  viability_looseness: 1.0
  dump_enabled: true
  dump_channel: APC-Cy7-A
  dump_cutoff: null
  dump_looseness: 1.0
  export_clean_fcs: false
04_transformation:
  enabled: true
  method: arcsinh
  cofactor: 150.0
  channels: auto
  exclude_channels: null
04_batch_preparation:
  enabled: true
  normalization_method: cytonorm
  batch_column: batch_id
  goal: median
  mode: min_sample
  target_events: 50000
  min_events_threshold: 2500
  assess_batch_effect: true
  overwrite_autocheck: false
05_population_discovery:
  enabled: true
  lineage_markers: auto
  marker_roles:
  - lineage
  clustering_method: som
  n_clusters: 8
  auto_k: true
  auto_k_method: consensus
  k_min: 4
  k_max: 14
  consensus_subsample: 0.8
  consensus_iterations: 50
  compute_umap: true
  umap_events_per_sample: 1000
  umap_covariates:
  - batch_id
  stratified_density_contours: true
  cluster_palette: tab20
  export_prism: true
06_statistical_analysis:
  enabled: true
  condition_column: condition
  reference_group: PBS_Vehicle_Control
  target_group: Caerin_F1_F3_Treated
  da_test_method: auto
  ds_test_method: auto
  fdr_threshold: 0.05
  log2fc_threshold: 1.0
  stats_granularity: populations
  generate_abundance_boxplots: true
  generate_volcano_plot: true
  generate_forest_plot: true
  generate_ds_heatmap: true
exports:
  enabled: true
  export_augmented_fcs: true
  export_flowjo_wsp: true
  export_gating_ml: true
  generate_miflowcyt_report: true
output:
  output_dir: outputs/config_run/conventional/li_2025_caerin_macrophage_cd24
  timestamp_dir: false
  overwrite: true
