# ==============================================================================
# Balin 2025 OMIP-116 Human Thymopoiesis Spectral Benchmark (Unified Config Schema)
# ==============================================================================

input:
  fcs_file: data/spectral/balin_2025_thymopoiesis_omip116
  technology: spectral
  metadata_file: data/spectral/balin_2025_thymopoiesis_omip116/metadata/samples.csv
  markers_file: data/spectral/balin_2025_thymopoiesis_omip116/metadata/markers.csv
  files_list:
  - data/spectral/balin_2025_thymopoiesis_omip116/raw/samples/UnmixingErr_Adj_PBMC_448_PeacoQCGoodEvents.fcs
  - data/spectral/balin_2025_thymopoiesis_omip116/raw/samples/UnmixingErr_Adj_Thymus_HC22_PeacoQCGoodEvents.fcs
analysis:
  gating_mode: som
  cluster_parent: viable
  qc_method: clustering
  adaptive_gating: true
  enable_qc: true
  enable_discovery: true
  numbered_steps: true
  seed: 42
  log_level: INFO
visualization:
  legend_mode: centroid
01_time_qc:
  enabled: true
  bin_width: null
02_compensation:
  enabled: false
  source: none
03_cleanup_gating:
  enabled: true
  debris_method: gmm
  debris_n_components: 3
  debris_sd_scale: 1.35
  debris_min_probability: null
  singlet_mode: dual
  singlet_method: gmm_ratio
  singlet_tolerance: 0.35
  enable_viability: true
  viability_channel: FJComp-UV446-A
  viability_cutoff: null
  viability_looseness: 1.35
  dump_enabled: true
  dump_channel: FJComp-R675-A
  dump_cutoff: null
  dump_looseness: 1.35
  export_clean_fcs: false
04_transformation:
  enabled: true
  method: arcsinh
  cofactor: 150.0
  channels: auto
  exclude_channels: null
04_batch_preparation:
  enabled: true
  normalization_method: quantile
  batch_column: batch_id
  goal: median
  mode: min_sample
  target_events: 50000
  min_events_threshold: 2500
  assess_batch_effect: true
  overwrite_autocheck: false
05_population_discovery:
  enabled: true
  lineage_markers: auto
  marker_roles:
  - lineage
  clustering_method: som
  n_clusters: 14
  auto_k: true
  auto_k_method: consensus
  k_min: 6
  k_max: 22
  consensus_subsample: 0.8
  consensus_iterations: 50
  compute_umap: true
  umap_events_per_sample: 1000
  umap_covariates:
  - batch_id
  stratified_density_contours: true
  cluster_palette: tab20
  export_prism: true
06_statistical_analysis:
  enabled: true
  condition_column: condition
  reference_group: PBMC_Healthy_Adjusted
  target_group: Thymus_Healthy_Adjusted
  da_test_method: auto
  ds_test_method: auto
  fdr_threshold: 0.05
  log2fc_threshold: 1.0
  stats_granularity: populations
  generate_abundance_boxplots: true
  generate_volcano_plot: true
  generate_forest_plot: true
  generate_ds_heatmap: true
exports:
  enabled: true
  export_augmented_fcs: true
  export_flowjo_wsp: true
  export_gating_ml: true
  generate_miflowcyt_report: true
output:
  output_dir: outputs/config_run/spectral/balin_2025_thymopoiesis_omip116
  timestamp_dir: false
  overwrite: true
