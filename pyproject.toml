[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowx"
dynamic = ["version"]
description = "Modular, Automated Flow Cytometry Analysis Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flowkit>=1.3.0",
    "flowutils>=1.2.0",
    "fcsparser>=0.2.4",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "minisom>=2.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tqdm>=4.60.0",
    "umap-learn>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "typeguard>=4.0.0",
]
phenograph = [
    "phenograph>=1.5.7",
]

[project.scripts]
flowx = "flowx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowx = ["visualization/fonts/*.ttf", "visualization/fonts/*.txt"]

[tool.setuptools.dynamic]
version = { attr = "flowx.__version__" }

